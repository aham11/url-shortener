apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: url-shortener-route
spec:
  parentRefs:
    - name: url-shortener-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: url-shortener-backend
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /_next
      backendRefs:
        - name: url-shortener-frontend
          port: 80
    - matches:
        - path:
            type: Exact
            value: /
      backendRefs:
        - name: url-shortener-frontend
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: url-shortener-backend
          port: 80
